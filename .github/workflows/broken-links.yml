name: Check external links

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 1 * *"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source links
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          args: --user-agent 'curl/7.54' --exclude-path _pages/404.md --verbose --no-progress './**/*.md' './**/*.html'
