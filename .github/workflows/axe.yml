name: Check accessibility

on:
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: bundle exec jekyll build --trace && npm run purge

      - name: Resolve Chromium version
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}

      - name: Install accessibility tools
        run: npm install --no-save @axe-core/cli http-server chromedriver@$CHROMIUM_VERSION

      - name: Run axe
        run: |
          npx http-server _site/ &
          npx axe \
            --chromedriver-path ./node_modules/chromedriver/bin/chromedriver \
            http://localhost:8080/ \
            http://localhost:8080/publications/ \
            http://localhost:8080/projects/ \
            http://localhost:8080/repositories/ \
            http://localhost:8080/CV/ \
            --load-delay=1500 \
            --exit
